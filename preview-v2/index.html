<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>East Bay Mobility</title>
<style>html,body{margin:0;background:#0b1220;height:100%}#boot{color:#fff;font:14px system-ui;display:flex;align-items:center;justify-content:center;height:100%}</style>
</head><body><div id="boot">Loading preview…</div>
<script>
(async function(){
  const parts=16, splashParts=17;
  const get=async (u)=>{const r=await fetch(u); if(!r.ok) throw new Error(u+' '+r.status); return r.text();};
  const b64ToU8=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  let splashUrl=null;
  try{
    const bins=[];
    for(let i=0;i<splashParts;i++) bins.push(b64ToU8(await get('../assets/splash-'+i+'.b64')));
    splashUrl=URL.createObjectURL(new Blob(bins,{type:'video/mp4'}));
  }catch(e){console.warn(e)}
  const bins=[];
  for(let i=0;i<parts;i++) bins.push(b64ToU8(await get('./part-'+i+'.b64')));
  let total=bins.reduce((n,b)=>n+b.length,0), all=new Uint8Array(total), off=0;
  for(const b of bins){ all.set(b,off); off+=b.length; }
  let html=new TextDecoder('utf-8').decode(all);
  if(splashUrl) html=html.replace(/<video id="ebm-splash-video"([^>]*?)src=""/,'<video id="ebm-splash-video"$1src="'+splashUrl+'"');
  document.open(); document.write(html); document.close();
})().catch(e=>{document.getElementById('boot').textContent='Failed: '+e;});
</script></body></html>
